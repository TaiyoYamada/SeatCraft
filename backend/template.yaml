AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: SeatCraft API - 席配置サービス

Parameters:
  Stage:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - staging
      - prod

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 30
    MemorySize: 256
    Environment:
      Variables:
        TABLE_NAME: !Sub "seatcraft_layouts_${Stage}"
        IS_LOCAL: 'false'

Resources:
  # API Gateway
  SeatCraftApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"
        AllowOrigin: "'*'"

  # POST /shuffle
  ShuffleFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'seatcraft-shuffle-${Stage}'
      CodeUri: dist/
      Handler: shuffle-handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Sub "seatcraft_layouts_${Stage}"
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref SeatCraftApi
            Path: /shuffle
            Method: POST

  # GET /result/{id}
  ResultFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'seatcraft-result-${Stage}'
      CodeUri: dist/
      Handler: result-handler.handler
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Sub "seatcraft_layouts_${Stage}"
      Events:
        Api:
          Type: Api
          Properties:
            RestApiId: !Ref SeatCraftApi
            Path: /result/{id}
            Method: GET

Outputs:
  ApiEndpoint:
    Description: API Gateway endpoint URL
    Value: !Sub 'https://${SeatCraftApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}'

  ShuffleFunctionArn:
    Description: Shuffle Lambda Function ARN
    Value: !GetAtt ShuffleFunction.Arn

  ResultFunctionArn:
    Description: Result Lambda Function ARN
    Value: !GetAtt ResultFunction.Arn
